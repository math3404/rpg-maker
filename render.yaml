
services:
  - type: web
    name: rpg-maker
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: gunicorn rpg_maker.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
