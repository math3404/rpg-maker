{% extends 'taverna/base.html' %}
{% block title %}Novo integrante | RPG Maker{% endblock %}
{% block content %}
<div class="page-heading mb-4"><span class="eyebrow">Banco remoto Supabase</span><h1>Novo integrante</h1><p>Cadastre alguém para fazer parte da equipe da RPG Maker.</p></div>
<section class="form-card narrow">
    <form method="post" novalidate>{% csrf_token %}
        <div class="form-row"><label for="nome">Nome completo</label><input class="form-control" id="nome" name="nome" maxlength="150" required value="{{ request.POST.nome|default:'' }}"></div>
        <div class="form-row"><label for="cargo">Cargo / classe</label><input class="form-control" id="cargo" name="cargo" maxlength="120" required placeholder="Ex.: Mestre de RPG" value="{{ request.POST.cargo|default:'' }}"></div>
        <div class="form-row"><label for="biografia">Biografia</label><textarea class="form-control" id="biografia" name="biografia" rows="4" required>{{ request.POST.biografia|default:'' }}</textarea></div>
        <div class="form-row"><label for="foto_url">URL do retrato (opcional)</label><input class="form-control" type="url" id="foto_url" name="foto_url" placeholder="https://..." value="{{ request.POST.foto_url|default:'' }}"></div>
        <div class="d-flex gap-2 mt-4"><button class="btn btn-gold flex-grow-1" type="submit">Cadastrar integrante</button><a class="btn btn-outline-gold" href="{% url 'gerenciar_equipe' %}">Cancelar</a></div>
    </form>
</section>
{% endblock %}
